# Main Monitor
monitor=DP-1,1920x1080@165,0x0,1
workspace= 1, monitor:DP-1, default:true
workspace= 2, monitor:DP-1
workspace= 3, monitor:DP-1
workspace= 4, monitor:DP-1

# 2nd Monitor
#monitor=HDMI-A-1,1920x1080@75,1920x-580,1,transform,3     # Vertical
monitor=HDMI-A-1,1920x1080@75,1920x0,1                    # Horizontal
workspace= 5, monitor:HDMI-A-1, default:true
workspace= 6, monitor:HDMI-A-1
workspace= 7, monitor:HDMI-A-1
workspace= 8, monitor:HDMI-A-1

# 3rd VNC "Monitor"
monitor=VNC,1920x1080@60,-1920x0,1
workspace= 10, monitor:VNC, default:true
workspace= 11, monitor:VNC
workspace= 12, monitor:VNC
workspace= 13, monitor:VNC

monitor=HDMI-A-2,1920x1080@144,0x0,1                    # Horizontal

