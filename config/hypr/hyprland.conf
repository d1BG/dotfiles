  # Screenshot
$screenshotScript = /home/deni111bg/.config/scripts/screenshot/screenshot.sh # Selection
$fullScreenshotScript = /home/deni111bg/.config/scripts/screenshot/full-screenshot.sh # full
bind = , Print, exec, $screenshotScript
bind = SHIFT, Print, exec, $fullScreenshotScript

  # Global Audio
$audio = /home/deni111bg/.config/scripts/audio-control.sh
bindel =, XF86AudioRaiseVolume, exec, $audio inc
bindel =, XF86AudioLowerVolume, exec, $audio dec
bindel =CONTROL, KP_Subtract, exec, $audio mute

  # Clipboard & fzf
    # 60 = Dot  // 61 = slash
$clipboard = foot /home/deni111bg/.config/scripts/clipboard/cliphist-fzf-hypr.sh
$unicodePicker = foot /home/deni111bg/.config/scripts/unicode/picker.sh
$7tv = foot /home/deni111bg/.config/scripts/7tv/7tv-browser.sh
bind = $mainMod, V, exec, [float; center; size 1200 650] $clipboard
bind = $mainMod, code:60, exec, [float; center; size 1200 650] $unicodePicker
bind = $mainMod, code:61, exec, [float; center; size 1200 650] $7tv


  # Media media
    # 112 = Page Up // 117 = Page Down
    # 110 = Home    // 115 = End
$mediaPlayer = /home/deni111bg/.config/scripts/media/mediaPlayer.sh

bindl = CONTROL_SHIFT, code:112, exec, $mediaPlayer incVol
bindl = CONTROL_SHIFT, code:117, exec, $mediaPlayer decVol
bindl = CONTROL_SHIFT, code:110, exec, $mediaPlayer next
bindl = CONTROL_SHIFT, code:115, exec, $mediaPlayer prev
	
bindl = , XF86Tools, exec, $mediaPlayer launch
bindl = , XF86AudioPlay, exec, $mediaPlayer play-pause
bindl = , XF86AudioPause, exec, $mediaPlayer play-pause
bindl = , XF86AudioNext, exec, $mediaPlayer next
bindl = , XF86AudioPrev, exec, $mediaPlayer prev

  # Rofi
bind = $mainMod, A, exec, $menu
bind = $mainMod, code:59, exec, rofimoji --action copy

  # Waybar toggle
bind = CONTROL, ESCAPE, exec, killall waybar || waybar   # toggle waybar

  # HyprExpo
$hyprexpo = /home/deni111bg/.config/scripts/hyprexpo.sh 
bind = SUPER, SPACE, exec, $hyprexpo

  # Zooming
$zoom = /home/deni111bg/.config/scripts/hyprzoom.sh
binde = $mainMod, code:21, exec, $zoom in
binde = $mainMod, code:20, exec, $zoom out
bind = $mainMod, code:19, exec, $zoom zero

  # GPU Screen Recorder - record last 30s
bind = $mainMod, code:118, exec, killall -SIGUSR1 gpu-screen-recorder

  # ani-cli
bind = $mainMod, i, exec, ani-cli --vlc --rofi

