    # Open a VNC server
#exec-once = hyprctl output create headless VNC
#exec-once = wayvnc -o VNC 100.74.232.61 5900 -f=60

	# Waybar & Hyprpaper
exec-once = waybar 
exec-once = hyprpaper

  # arRPC
exec-once = arrpc

	# Copy-paste
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

	# Comms
exec-once = vesktop 
exec-once = signal-desktop
windowrulev2 = workspace 5,class:(vesktop)
windowrulev2 = workspace 5,class:(signal)

	# Elisa
# exec-once = QT_QPA_PLATFORMTHEME=kde elisa
windowrulev2 = workspace 3 silent, class:(org.kde.elisa)
windowrulev2 = float, class:(org.kde.elisa)
  
  # Dunst
exec-once = dunst
  
  #plugins
exec-once = hyprpm reload -n

  # GPU SCREEN REC
exec-once = gpu-screen-recorder -w DP-1 -f 30 -q high -a "default_output|default_input" -ac opus -c mp4 -r 30 -o "$HOME/Videos/GSR"
  
  # OpenRGB
exec-once = openrgb -p Purple
# exec-shutdown = openrgb -p 'No Lights'

  # BlueLight filter
# exec-once = wlsunset -T 6600 -t 3600 -S 07:00 -s 22:00 -d 300

  # jamesdsp
# exec-once = jamesdsp
windowrulev2 = workspace 9 silent, class:(jamesdsp)

exec-once = /usr/lib/xdg-desktop-portal-cosmic

# Some default env vars.
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = MOZ_ENABLE_WAYLAND,1

  # Please Dolphin work propperly
env = XDG_MENU_PREFIX,arch-
exec-once = kbuildsycoca6 

# Cursor
exec-once = hyprctl setcursor Bibata-Modern-Classic 24
exec-once = gsettings set org.gnome.desktop.interface cursor-theme Bibata-Modern-Classic
exec-once = gsettings set org.gnome.desktop.interface cursor-size 24
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24

# Nvidia
source = ~/.config/hypr/nvidia.conf

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us,bg
    kb_variant = ,phonetic

    kb_options= grp:alt_shift_toggle
    numlock_by_default = true
    
    follow_mouse = 1
    sensitivity = -0.7 # -1.0 to 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 3
    gaps_out = 5
    border_size = 3
    col.active_border = rgba(8A2670ff) rgba(8A2670ff) 270deg 
    col.inactive_border = rgba(595959aa)

    layout = dwindle

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 5
    
    blur {
        enabled = true
        size = 4
        passes = 2
    }
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
    animation = fadeDim, 5, 100, myBezier
}

dwindle {
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

misc {
    vrr = 0
    disable_hyprland_logo = true
    disable_splash_rendering = false 
    force_default_wallpaper = 0
}

#render {
#  explicit_sync = 0
#  explicit_sync_kms = 0
#}

cursor {
    no_hardware_cursors = true
}

plugin {
    hyprexpo {
        columns = 2
        gap_size = 5
        bg_col = rgb(00EBC3)
        workspace_method = first 1 # [center/first] [workspace] e.g. first 1 or center m+1
    }
}

